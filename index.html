<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohan Balaji — Full-stack &amp; Systems Engineer</title>
    <meta name="description" content="Mohan Balaji is a full-stack and systems engineer in Hyderabad building isolated code-execution sandboxes, high-concurrency backends and fast, polished web interfaces." />
    <meta name="author" content="Badri Mohan Balaji" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mohanbalaji.in/" />
    <meta property="og:title" content="Mohan Balaji — Full-stack &amp; Systems Engineer" />
    <meta property="og:description" content="Isolated sandboxes, high-concurrency backends and fast, polished web interfaces." />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

    <!-- Apply the saved / system theme before first paint to avoid a flash -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('mb-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
